<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>てこがつり合うときのきまりをみつけよう</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb}main{max-width:980px;margin:auto;padding:18px}
h1{font-size:clamp(1.2rem,3.8vw,2rem);margin:0 0 6px}p{line-height:1.6}.intro{color:#526176;margin-top:0}
.panel{background:white;border:1px solid #dbe3ed;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 3px 12px #162b4610}
.workspace{display:grid;grid-template-columns:minmax(130px, .8fr) minmax(0, 3.4fr) minmax(130px, .8fr);gap:10px;align-items:center}.controls-col{display:flex;flex-direction:column;gap:18px;min-width:0}.control{background:#f8fafc;border-radius:12px;padding:10px;min-width:0}.control label{font-weight:700;font-size:.95rem;display:block;margin-bottom:8px}.control output{font-weight:700}.model{min-width:0}.model svg{width:100%}

input[type=range]{width:100%;height:36px;accent-color:#2878bb;cursor:pointer;touch-action:pan-y;-webkit-appearance:none;appearance:none;background:transparent;margin:2px 0}input[type=range]::-webkit-slider-runnable-track{height:8px;background:#d5e0ec;border-radius:999px}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:#2878bb;border:2px solid #fff;box-shadow:0 0 0 1px #2878bb}input[type=range]::-moz-range-track{height:8px;background:#d5e0ec;border-radius:999px}input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#2878bb;border:2px solid #fff}button{min-height:44px;touch-action:manipulation}
svg{display:block;width:100%;height:auto;touch-action:manipulation;margin-bottom:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}
.gridpair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.side{border-radius:12px;padding:12px}.side h2{font-size:1.1rem;margin:0 0 6px}.left{background:#eaf4ff}.right{background:#fff0ee}
.result{font-size:1.12rem;font-weight:750;text-align:center;padding:14px;border-radius:12px;background:#f1f5f9}
button{font:inherit;font-weight:700;border:1px solid #b8c7d9;border-radius:10px;padding:10px 14px;background:white;color:#172033;cursor:pointer}button:active{transform:translateY(1px)}.buttons{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:.88rem;color:#59677a}
@media(max-width:700px){main{padding:8px}.panel{padding:8px}.workspace{grid-template-columns:1fr 1fr;gap:8px}.model{grid-column:1 / -1;grid-row:1}.controls-col{gap:8px}.control{padding:8px}.control label{font-size:.85rem}input[type=range]{height:32px}}
</style>
</head>
<body><main>
<h1>てこがつり合うときのきまりをみつけよう</h1>
<section class="panel all-in-one">
<div class="workspace">
  <div class="controls-col" aria-label="左側の条件">
    <div class="control"><label for="ld">左の距離：<output id="ldv">3</output></label><input id="ld" type="range" min="1" max="6" value="3"></div>
    <div class="control"><label for="lw">左のおもり：<output id="lwv">40g</output></label><input id="lw" type="range" min="1" max="18" value="4"></div>
  </div>
  <div class="model">
    <svg id="lever" viewBox="-10 0 740 405" role="img" aria-label="左右に目盛りと面積のマスがあるてこの図"></svg>
  </div>
  <div class="controls-col" aria-label="右側の条件">
    <div class="control"><label for="rd">右の距離：<output id="rdv">4</output></label><input id="rd" type="range" min="1" max="6" value="4"></div>
    <div class="control"><label for="rw">右のおもり：<output id="rwv">30g</output></label><input id="rw" type="range" min="1" max="18" value="3"></div>
  </div>
</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const val=id=>Number($(id).value);
function svgEl(tag,attrs={},text=""){const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}
function drawLever(ld,lw,rd,rw){
  const s=$("lever");s.replaceChildren();
  const cx=360,step=36,y=58, maxDistance=6, maxWeight=18;
  const leftEdge=cx-maxDistance*step, rightEdge=cx+maxDistance*step;
  s.append(svgEl("line",{x1:leftEdge,y1:y,x2:rightEdge,y2:y,stroke:"#65758b","stroke-width":7,"stroke-linecap":"round"}));
  for(let i=1;i<=maxDistance;i++){
    for(const sign of [-1,1]){
      const x=cx+sign*i*step;
      s.append(svgEl("line",{x1:x,y1:y-12,x2:x,y2:y+13,stroke:"#344256","stroke-width":2}));
      s.append(svgEl("text",{x,y:y-17,"text-anchor":"middle","font-size":14,"font-weight":700,fill:"#344256"},String(i)));
    }
  }

  function grid(x,y0,d,w,color,flip){
    const cellW=step,cellH=19,width=maxDistance*cellW;
    for(let r=0;r<maxWeight;r++) for(let c=0;c<maxDistance;c++){
      const active=r<w&&c<d;
      const xx=flip?x+width-(c+1)*cellW:x+c*cellW;
      s.append(svgEl("rect",{x:xx,y:y0+r*cellH,width:cellW-2,height:cellH-2,rx:2,fill:active?color:"#ffffff",stroke:active?color:"#b8c6d6","stroke-width":1}));
    }
  }
  // 面積図は中央の支点位置を基準に、横棒の下辺へ直接接するように配置
  const gw=maxDistance*step,gy=y;
  grid(cx-gw,gy,ld,lw,"#398dd0",true);
  grid(cx,gy,rd,rw,"#d95750",false);
}
function update(){
 const ld=val("ld"),lw=val("lw"),rd=val("rd"),rw=val("rw");
 for(const [id,v] of [["ldv",ld],["rdv",rd]])$(id).textContent=v;
  $("lwv").textContent=(lw*10)+"g";
  $("rwv").textContent=(rw*10)+"g";
 drawLever(ld,lw,rd,rw);

}
["ld","lw","rd","rw"].forEach(id=>$(id).addEventListener("input",update));
update();
</script></body></html>
